<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Hub — AI Workshop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Itim&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Itim', 'Comic Sans MS', cursive, sans-serif;
      background-color: #fdfaf6;
      color: #2d3748;
      padding: 40px 20px;
      max-width: 800px;
      margin: 0 auto;
    }
    header {
      margin-bottom: 30px;
    }
    h1 { font-size: 2.2rem; margin-bottom: 8px; color: #ff6b6b; letter-spacing: 0.5px; }
    p.subtitle { color: #718096; font-size: 1.15rem; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
    }
    .card {
      background: #ffffff;
      border: 2px solid #ffd166;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 4px 0 #ffd166;
      transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
      text-decoration: none;
      color: inherit;
      display: block;
    }
    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 7px 0 #f4a261;
      border-color: #f4a261;
    }
    .card h2 { font-size: 1.4rem; margin-bottom: 8px; color: #06d6a0; }
    .card p { color: #4a5568; font-size: 1.05rem; line-height: 1.5; }
  </style>
</head>
<body>
  <header>
    <h1>Portal Hub</h1>
    <p class="subtitle">ศูนย์กลางระบบ Workshop Agentic AI บน Cloudflare Workers</p>
  </header>
  <div class="grid">
    <a href="/chat/" class="card">
      <h2>💬 หน้าต่าง Chat</h2>
      <p>คุยกับ AI แบบหลายโมเดล (Gemini, OpenAI, Custom Gateway) ผ่าน Backend Worker</p>
    </a>
  </div>
</body>
</html>
