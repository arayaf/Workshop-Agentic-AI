<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat with AI</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f7f9fa;
      color: #333;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      background: #fff;
      border-bottom: 1px solid #e1e4e8;
      padding: 12px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
    }
    .header-title {
      font-size: 1.15rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .header-title a {
      text-decoration: none;
      color: #0366d6;
      font-size: 0.9rem;
    }
    .controls {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    select, input[type="text"] {
      padding: 6px 10px;
      border: 1px solid #d1d5da;
      border-radius: 6px;
      font-size: 0.9rem;
    }
    #chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .message {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 12px;
      line-height: 1.45;
      word-break: break-word;
      white-space: pre-wrap;
    }
    .message.user {
      align-self: flex-end;
      background-color: #0070f3;
      color: #fff;
      border-bottom-right-radius: 2px;
    }
    .message.assistant {
      align-self: flex-start;
      background-color: #fff;
      border: 1px solid #e1e4e8;
      border-bottom-left-radius: 2px;
    }
    .message.system {
      align-self: center;
      background-color: #f1f8ff;
      color: #0366d6;
      font-size: 0.85rem;
    }
    footer {
      background: #fff;
      border-top: 1px solid #e1e4e8;
      padding: 12px 20px;
    }
    #chat-form {
      display: flex;
      gap: 10px;
    }
    #message-input {
      flex: 1;
      padding: 10px 14px;
      border: 1px solid #d1d5da;
      border-radius: 8px;
      font-size: 1rem;
    }
    button {
      padding: 10px 18px;
      background-color: #0070f3;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }
    button:disabled {
      background-color: #a0c3f5;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <header>
    <div class="header-title">
      💬 <span>หน้าต่าง Chat</span>
      <a href="/">← กลับ Hub</a>
    </div>
    <div class="controls">
      <label for="provider-select">Provider:</label>
      <select id="provider-select">
        <option value="gemini">Google Gemini</option>
        <option value="openai">OpenAI</option>
        <option value="openai-compat">Custom Gateway (OpenAI-compatible)</option>
      </select>

      <label for="model-input">Model:</label>
      <input type="text" id="model-input" placeholder="model name" />
    </div>
  </header>

  <main id="chat-container"></main>

  <footer>
    <form id="chat-form">
      <input type="text" id="message-input" placeholder="พิมพ์ข้อความที่นี่..." autocomplete="off" />
      <button type="submit" id="send-btn">ส่ง</button>
    </form>
  </footer>

  <script src="/chat/app.js"></script>
</body>
</html>
