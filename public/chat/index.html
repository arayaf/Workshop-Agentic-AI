<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat with AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Itim&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Itim', 'Comic Sans MS', cursive, sans-serif;
      background-color: #fdfaf6;
      color: #2d3748;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      background: #fff;
      border-bottom: 2px solid #ffd166;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
    }
    .header-title {
      font-size: 1.3rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
      color: #ff6b6b;
    }
    .header-title a {
      text-decoration: none;
      color: #118ab2;
      font-size: 1rem;
    }
    .controls {
      display: flex;
      gap: 10px;
      align-items: center;
      font-size: 1rem;
    }
    select, input[type="text"] {
      font-family: inherit;
      padding: 6px 12px;
      border: 2px solid #ffd166;
      border-radius: 12px;
      font-size: 0.95rem;
      background: #fff;
      outline: none;
    }
    #chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .message {
      max-width: 80%;
      padding: 12px 18px;
      border-radius: 18px;
      line-height: 1.5;
      word-break: break-word;
      white-space: pre-wrap;
      font-size: 1.05rem;
    }
    .message.user {
      align-self: flex-end;
      background-color: #ff6b6b;
      color: #fff;
      border-bottom-right-radius: 4px;
      box-shadow: 0 3px 0 #d9534f;
    }
    .message.assistant {
      align-self: flex-start;
      background-color: #fff;
      border: 2px solid #ffd166;
      border-bottom-left-radius: 4px;
      box-shadow: 0 3px 0 #ffd166;
    }
    .message.system {
      align-self: center;
      background-color: #e8f4f8;
      color: #118ab2;
      font-size: 0.95rem;
      border-radius: 14px;
    }
    footer {
      background: #fff;
      border-top: 2px solid #ffd166;
      padding: 14px 20px;
    }
    #chat-form {
      display: flex;
      gap: 10px;
    }
    #message-input {
      font-family: inherit;
      flex: 1;
      padding: 10px 16px;
      border: 2px solid #ffd166;
      border-radius: 14px;
      font-size: 1.05rem;
      outline: none;
    }
    button {
      font-family: inherit;
      padding: 10px 22px;
      background-color: #06d6a0;
      color: #fff;
      border: none;
      border-radius: 14px;
      font-weight: 600;
      font-size: 1.05rem;
      cursor: pointer;
      box-shadow: 0 3px 0 #059669;
    }
    button:disabled {
      background-color: #a7f3d0;
      box-shadow: none;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <header>
    <div class="header-title">
      💬 <span>หน้าต่าง Chat</span>
      <a href="/">← กลับ Hub</a>
    </div>
    <div class="controls">
      <label for="provider-select">Provider:</label>
      <select id="provider-select">
        <option value="gemini">Google Gemini</option>
        <option value="openai">OpenAI</option>
        <option value="openai-compat">Custom Gateway (OpenAI-compatible)</option>
      </select>

      <label for="model-input">Model:</label>
      <input type="text" id="model-input" placeholder="model name" />
    </div>
  </header>

  <main id="chat-container"></main>

  <footer>
    <form id="chat-form">
      <input type="text" id="message-input" placeholder="พิมพ์ข้อความที่นี่..." autocomplete="off" />
      <button type="submit" id="send-btn">ส่ง</button>
    </form>
  </footer>

  <script src="/chat/app.js"></script>
</body>
</html>
